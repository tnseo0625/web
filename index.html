<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>음악 랜덤 사이트</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body> 

  <h1>음악 랜덤 사이트</h1>

  <!-- 장르 선택 -->
  <div class="section">
    <h2>노래 장르 선택</h2>
    <input type="radio" name="genre" value="K-Pop"> K-Pop
    <input type="radio" name="genre" value="팝"> 팝
    <input type="radio" name="genre" value="발라드"> 발라드
    <input type="radio" name="genre" value="힙합"> 힙합
  </div>

  <!-- 자동재생 / 음소거 옵션 -->
  <div class="options">
    <label><input type="checkbox" id="autoplay" checked> 자동 재생</label>
    <label><input type="checkbox" id="mute"> 음소거</label>
  </div>

  <!-- 검색 버튼 -->
  <button id="searchBtn">검색</button>

  <!-- 유튜브 창 + 하이퍼링크 -->
  <div id="playerArea" style="display:none;">
    <iframe
      id="ytFrame"
      width="600"
      height="350"
      src=""
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
    <div id="linkArea">
      <a id="ytLink" href="#" target="_blank">유튜브에서 자세히 보기 (새 창)</a>
    </div>
  </div>
  
</body>
</html>
